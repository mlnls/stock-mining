# 복사해서 config.yaml 로 사용하세요. 비밀값(토큰)은 여기 두지 말고 환경변수(서버에선 SSM)로 넣습니다.
#   Slack: SLACK_BOT_TOKEN(xoxb-), SLACK_APP_TOKEN(xapp-), SLACK_USER_ID(U...)
#   Claude: CLAUDE_CODE_OAUTH_TOKEN(구독, `claude setup-token`) 또는 ANTHROPIC_API_KEY(유료 API)
# 여기 없는 값은 src/stockmining/config.py 의 시장별 기본값을 씁니다.

market: us                   # us(미국, 기본) | kr(한국)
notifier: slack              # slack(기본) | telegram | console
profile: normal              # normal(기본) | aggressive(공격형: 3종목 집중, 1회 손실 2%, 추세·돌파 4개 전략만)
                             # 프로필 값보다 아래에 직접 적은 값이 우선합니다

account:
  capital: 10000             # 운용 자금 (USD)
  risk_per_trade: 0.01       # 1회 매매 최대 손실 = 자금의 1%
  max_positions: 5
  max_new_per_day: 2
  max_position_weight: 0.25
  max_stop_pct: 15           # 손절가가 진입가보다 15% 넘게 아래인 종목(변동성 과다)은 추천 제외
  fractional_shares: false   # true → 소수점 수량 추천 (소액 계좌에 필요. 증권사 소수점 거래 지원 여부 확인)

universe:
  pool_per_exchange: 800     # NASDAQ·NYSE 각각 시총 상위 N개 + S&P 500 전체를 매일 갱신
  min_price: 5               # 5달러 미만 제외
  min_avg_value_20: 20000000 # 20일 평균 거래대금 2,000만 달러 이상 (백테스트에선 그날 기준으로 적용)
  history_years: 4

costs:
  commission: 0.001          # 국내 증권사 미국주식 수수료 0.07~0.25% → 0.1% 가정. 본인 수수료로 바꾸세요
  sell_tax: 0.00003          # SEC fee (매도 시)
  slippage: 0.0005           # 편도 슬리피지 가정

backtest:
  oos_fraction: 0.25
  gate:                      # 새 규칙(Claude 제안 포함)이 통과해야 하는 기준
    min_trades: 40
    min_profit_factor: 1.2
    min_expectancy_pct: 0.3
    min_oos_profit_factor: 1.05
    max_mdd_pct: 35

learner:
  prior_trades: 30
  min_paper_trades_to_mute: 20
  paper_top_k: 3
  auto_adopt_params: true    # 파라미터 튜닝은 워크포워드 통과 시 자동 반영 (원칙·새 규칙은 항상 승인 필요)

claude:
  model: claude-opus-5-5
  effort_daily: medium
  effort_research: high
  web_search_max_uses: 8
